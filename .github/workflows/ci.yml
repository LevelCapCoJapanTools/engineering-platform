name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: engineering
          POSTGRES_USER: engineering
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U engineering -d engineering"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://engineering:local-dev-only@127.0.0.1:5432/engineering
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked -- --include-ignored
      - run: cargo build --workspace --locked

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    name: Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  gate:
    name: CI Gate
    needs: [rust, web, compose]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUST_RESULT: ${{ needs.rust.result }}
      WEB_RESULT: ${{ needs.web.result }}
      COMPOSE_RESULT: ${{ needs.compose.result }}
    steps:
      - name: Require every job to succeed
        run: |
          printf 'Rust=%s Web=%s Compose=%s\n' "$RUST_RESULT" "$WEB_RESULT" "$COMPOSE_RESULT"
          [[ "$RUST_RESULT" == success && "$WEB_RESULT" == success && "$COMPOSE_RESULT" == success ]]
