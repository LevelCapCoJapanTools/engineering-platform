name: engineering-platform

x-backend: &backend
  image: engineering-platform-backend:dev
  environment:
    DATABASE_URL: postgres://engineering:local-dev-only@db:5432/engineering
    EP_DEMO_MODE: "1"
    API_BIND: 0.0.0.0:8080

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: engineering
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:${EP_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "engineering", "-d", "engineering"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: ["server"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EP_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    pull_policy: never
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      EP_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EP_WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
